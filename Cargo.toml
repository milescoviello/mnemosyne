[package]
name = "mnemosyne"
version = "0.4.13"
edition = "2021"
description = "Browse, search, tag and resume Claude Code sessions across every folder"
license = "MIT"
repository = "https://github.com/milescoviello/mnemosyne"
readme = "README.md"
keywords = ["claude", "tui", "sessions", "cli"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
nucleo-matcher = "0.3"
memchr = "2"
rayon = "1"
anyhow = "1"
chrono = "0.4"
libc = "0.2"
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
