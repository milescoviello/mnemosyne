[package]
name = "mnemosyne"
version = "0.6.1"
edition = "2021"
# The oldest Rust it builds with -- Debian 13's 1.85, Alpine 3.22's 1.87 --
# and resolver 3 keeps `cargo update` to what builds there. instability
# 0.3.11 and later want 1.88, which no stable Debian has.
rust-version = "1.85"
resolver = "3"
description = "Browse, search, tag and resume Claude Code sessions across every folder"
license = "MIT"
repository = "https://github.com/milescoviello/mnemosyne"
readme = "README.md"
keywords = ["claude", "tui", "sessions", "cli"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
# use-dev-tty: its reader stops at a hung-up terminal. The default one read
# it for ever, and mn stayed behind at full CPU once its window was closed.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
nucleo-matcher = "0.3"
memchr = "2"
rayon = "1"
anyhow = "1"
chrono = "0.4"
libc = "0.2"
toml = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
