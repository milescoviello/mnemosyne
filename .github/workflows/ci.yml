name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: build release
        run: cargo build --release
      # The wrappers are shell, so cargo test never sees them. This runs them
      # under bash, zsh and fish, against stub binaries and a private tmux
      # socket. zsh because the installer hands it mn.bash, and zsh is what
      # a Mac opens by default.
      - name: shell wrappers
        run: |
          sudo apt-get install -y --no-install-recommends fish tmux zsh
          tools/shell-selftest.sh
      # The installer, into empty home directories, for each shell it claims
      # to set up -- checked by running `mn` in a new shell afterwards.
      - name: installer
        run: tools/install-selftest.sh
      # Drives the real binary on a real pty. Guards the one contract no Rust
      # test can see: the interface draws on stderr and prints the chosen
      # session on stdout, so anything that writes to stdout by accident
      # breaks resuming without breaking a single test.
      - name: the plan on stdout stays machine-readable
        run: python3 tools/plan-smoke.py
