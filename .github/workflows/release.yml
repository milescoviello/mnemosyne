name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are musl and therefore static: one binary that runs
          # on any distro, whatever its libc.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: mnemosyne-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: mnemosyne-aarch64-linux
          # macOS builds are native per architecture; there is no static libc
          # to link against, so these are ordinary dynamic binaries.
          #
          # Intel macOS is built by release-intel-mac.yml instead. GitHub is
          # winding those runners down and a job can sit queued for an hour,
          # which would hold up every other platform's release behind it.
          - os: macos-14
            target: aarch64-apple-darwin
            asset: mnemosyne-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rusqlite compiles SQLite from source, so musl needs a C toolchain.
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mnemosyne dist/
          cp shell/mn.fish shell/mn.bash README.md LICENSE dist/
          tar -C dist -czf ${{ matrix.asset }}.tar.gz .
          # macOS ships shasum rather than sha256sum
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          generate_release_notes: true
